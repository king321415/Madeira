name: Build Madeira IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build Native Components
        run: |
          chmod +x build/*/build.sh || true
          if [ -f "./build/build_all.sh" ]; then
            ./build/build_all.sh
          fi

      - name: Build Xcode Project
        run: |
          xcodebuild -project Madeira.xcodeproj \
                     -scheme Madeira \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     clean build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Release-iphoneos/Madeira.app Payload/ || cp -r ~/Library/Developer/Xcode/DerivedData/*/Build/Products/Release-iphoneos/Madeira.app Payload/
          zip -r Madeira.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-IPA
          path: Madeira.ipa
