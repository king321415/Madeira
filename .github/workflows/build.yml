name: Build Madeira IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Fetch and Extract VC++ Runtime DLLs
        run: |
          brew install sevenzip
          
          # 1. 建立目標資料夾 (最關鍵，確保 Xcode 不會報錯)
          mkdir -p app/Madeira/x86_64-vcruntime
          mkdir -p /tmp/vcredist /tmp/payload
          
          # 2. 下載 VC++ 運行庫
          curl -L -o /tmp/vc_redist.x64.exe https://aka.ms/vc14/vc_redist.x64.exe
          
          # 3. 解壓第一層 (提取 AttachedContainer)
          7zz x /tmp/vc_redist.x64.exe -o/tmp/vcredist -y || true
          
          # 4. 解壓第二層 (解開 AttachedContainer 獲取 CAB 包)
          if [ -f "/tmp/vcredist/AttachedContainer" ]; then
            7zz x /tmp/vcredist/AttachedContainer -o/tmp/payload -y || true
          fi
          
          # 5. 解壓所有的 CAB 壓縮包
          find /tmp/payload -type f -iname "*.cab" -exec 7zz x {} -o/tmp/payload -y \; || true
          
          # 6. 查找並提取核心 DLL，自動重新命名為標準格式
          find /tmp/payload -type f -iname "*vcruntime140*" -exec cp {} app/Madeira/x86_64-vcruntime/vcruntime140.dll \;
          find /tmp/payload -type f -iname "*msvcp140*" -exec cp {} app/Madeira/x86_64-vcruntime/msvcp140.dll \;
          
          # 7. 放置空佔位文件，確保資料夾非空，保證 Xcode 打包順利通過
          touch app/Madeira/x86_64-vcruntime/.keep
          
          echo "處理完成，目前資源資料夾內容："
          ls -la app/Madeira/x86_64-vcruntime/

      - name: Build Native Components
        run: |
          chmod +x build/*/build.sh || true
          find . -name "build.sh" -exec chmod +x {} \;
          if [ -f "./build/build_all.sh" ]; then
            ./build/build_all.sh
          fi

      - name: Find and Build Xcode Project
        run: |
          PROJ_FILE=$(find . -maxdepth 3 -name "*.xcodeproj" -o -name "*.xcworkspace" | head -n 1)
          
          if [ -z "$PROJ_FILE" ]; then
            echo "Error: Could not find any .xcodeproj or .xcworkspace file!"
            exit 1
          fi
          
          echo "Found project file at: $PROJ_FILE"
          PROJ_DIR=$(dirname "$PROJ_FILE")
          PROJ_NAME=$(basename "$PROJ_FILE")
          
          cd "$PROJ_DIR"
          
          if [[ "$PROJ_NAME" == *.xcworkspace ]]; then
            xcodebuild -workspace "$PROJ_NAME" \
                       -scheme Madeira \
                       -configuration Release \
                       -sdk iphoneos \
                       CODE_SIGNING_ALLOWED=NO \
                       CODE_SIGNING_REQUIRED=NO \
                       clean build
          else
            xcodebuild -project "$PROJ_NAME" \
                       -scheme Madeira \
                       -configuration Release \
                       -sdk iphoneos \
                       CODE_SIGNING_ALLOWED=NO \
                       CODE_SIGNING_REQUIRED=NO \
                       clean build
          fi

      - name: Package IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find . -name "Madeira.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "Madeira.app" -type d | head -n 1)
          fi
          
          if [ -z "$APP_PATH" ]; then
            echo "Error: Madeira.app non-existent"
            exit 1
          fi
          
          echo "Found .app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r Madeira.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-IPA
          path: Madeira.ipa
